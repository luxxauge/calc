{% extends "base.html" %}
{% block content %}
<h1>Import – Mapping</h1>
<p class="muted">Datei: {{filename}} · Sheet: {{sheet}}</p>

<div class="card">
  <h3>Spaltenzuordnung</h3>
  <form method="post" action="/catalog/import/commit">
    <input type="hidden" name="import_id" value="{{import_id}}"/>
    <input type="hidden" name="sheet" value="{{sheet}}"/>
    <input type="hidden" name="source" value="{{source or ''}}"/>

    <div class="row">
      <div>
        <label>Sheet</label><br/>
        <select name="sheet_select" onchange="location.href='/catalog/import/map?import_id={{import_id}}&sheet=' + encodeURIComponent(this.value) + '&source={{(source or '')|urlencode}}'">
          {% for sh in sheets %}
            <option value="{{sh}}" {% if sh==sheet %}selected{% endif %}>{{sh}}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Header-Zeile</label><br/>
        <input name="header_row" type="number" min="1" value="1"/>
      </div>
      <div>
        <label>Daten ab Zeile</label><br/>
        <input name="start_row" type="number" min="2" value="2"/>
      </div>
    </div>

    {% for field,label in fields %}
    <div class="row" style="margin-top:8px">
      <div style="min-width:260px;max-width:260px">
        <strong>{{label}}</strong>
        {% if field in required %}<span class="pill">required</span>{% endif %}
      </div>
      <div>
        <select name="map__{{field}}">
          <option value="">— nicht zuordnen —</option>
          {% for h in headers %}
            <option value="{{h}}" {% if mapping[field]==h %}selected{% endif %}>{{h}}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    {% endfor %}

    <div style="margin-top:12px">
      <button type="submit">Import ausführen</button>
      <a class="muted" href="/catalog">Abbrechen</a>
    </div>
  </form>
</div>
{% endblock %}
